services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Maispace\MaiGallery\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  Maispace\MaiGallery\Indexer\GalleryIndexer:
    tags:
      - name: 'maispace.search.indexer'
      - name: 'maispace.search.result_formatter'

  dashboard.widget.maiGalleryManual:
    class: 'ProudNerds\PnBackendManual\Widgets\ManualWidget'
    arguments:
      $options:
        file: 'EXT:mai_gallery/Resources/Private/Manual/Manual.md'
        numbered: true
        contentsDepth: 2
        printButton: true
    tags:
      - name: dashboard.widget
        identifier: 'maiGalleryManual'
        groupNames: 'documentation'
        title: 'Handbuch: Galerie'
        description: 'Kurze Anleitung für Bildergalerien und Jahresarchive.'
        iconIdentifier: 'content-book'
        height: 'medium'
        width: 'medium'
